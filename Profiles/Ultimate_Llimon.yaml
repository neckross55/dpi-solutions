rules:
  - DOMAIN-SUFFIX,rambler.ru, Changed IP
# Трафик, который должен идти напрямую (РФ сервисы, банки)
  - GEOIP,ru,DIRECT
  - RULE-SET,my-force-direct,DIRECT
# локальные
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
# Популярные сервисы
  - RULE-SET,youtube,WARP
# Отдельные программы
  - PROCESS-NAME,Code.exe,Changed IP
  - PROCESS-NAME,Anty.exe,Changed IP
  - PROCESS-NAME,RvControlSvc.exe,Changed IP
# Трафик через VPN - смена IP  
