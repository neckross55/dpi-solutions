sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
  skip-domain:
    - '+.lan'
    - '+.local'

dns:
  enable: true
  # listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 9.9.9.9
    - 149.112.112.112
  nameserver:
    - https://dns.quad9.net/dns-query
    - https://dns10.quad9.net/dns-query
    - https://cloudflare-dns.com/dns-query

# Это смесь AWG 1.5 и AWG 2.0 - есть i2, но нет s3, s4
CPS0: &CPS0
  i1: <b >

CPS1: &CPS1
  i1: <b >
  i2: <b >

# dikoz
CPS2: &CPS2
  i1: <b 0xcb0000000101000000404e8b886f50abe705738fdf69eb3a33c2b0d6cf81df><r 22><b 0x3da92a8760277bcb93c5f5af104dee4ddc8f14ae><r 16>

CPS4: &CPS4
  i1: <b >

# ORI
CPS5: &CPS5
  i1: <b 0xca0000000101250000405515b38c4a0dfc382d91e39404070d645ab7bec6d0378e7383d1e2008f33e8ebf4><r 16>

# SagePtr
