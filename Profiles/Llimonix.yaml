# тут дает список адресов не для обхода, а для подключения к прокси
proxy-providers:
  BPB set:
    type: http
    url: "https://zhb1ejz8hcrotuhq-sllj1kmr7usle4m.h7wum98h88gh.workers.dev/sub/normal/%2CvPuXiD*ogjxQC%2C3?app=clash#%F0%9F%92%A6%20BPB%20Normal"
    path: ./remote-custom-providers/BPB1-sub.yml
    override:
      udp: true
      dialer-proxy: "WARP"
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

  proton_proxies:
    type: http
    url: "https://raw.githubusercontent.com/4kWarhammer/Proxi-Rule-Providers/refs/heads/main/Providers/proton-proxies.yaml"
    path: ./remote-custom-providers/proton-proxies.yaml
    override:
      dialer-proxy: "WARP"
    health-check:
      enable: true
      interval: 300
      url: https://cp.cloudflare.com/generate_204

rule-providers:
# токен доступа:
# 

  my-remote-request:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/4kWarhammer/Proxi-Rule-Providers/refs/heads/main/Providers/my-remote-request.yaml"
    path: ./remote-custom-providers/my-remote-request.yaml
    interval: 86400

# для дебагга, чтобы не дергать удаленный ресурс, а юзать локальный
  my-local-request:
    behavior: classical
    type: file
    path: ./remote-custom-providers/my-local-request.yaml

  ru-blocked:
    behavior: domain
    type: http
    format: text
    url: 'https://cdn.jsdelivr.net/gh/shvchk/unblock-net/lists/clash/ru-blocked'
    interval: 86400
    path: ./ruleset/ru-blocked.yaml

  twitter:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml"
    interval: 86400
    path: ./ruleset/twitter.yaml

  instagram:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Instagram/Instagram.yaml"
    interval: 86400
    path: ./ruleset/instagram.yaml

  facebook:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Facebook/Facebook.yaml"
    interval: 86400
    path: ./ruleset/facebook.yaml

  youtube:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml"
    interval: 86400
    path: ./ruleset/youtube.yaml

  discord-domain:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/fildunsky/clash_discord/refs/heads/main/discord-domain.yaml"
    interval: 86400
    path: ./ruleset/discord-domain.yaml

  discord-ip:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/fildunsky/clash_discord/refs/heads/main/discord-ip.yaml"
    interval: 86400
    path: ./ruleset/discord-ip.yaml

  whatsapp:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Whatsapp/Whatsapp.yaml"    
    interval: 86400
    path: ./ruleset/whatsapp.yaml

  notion:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Notion/Notion.yaml"
    interval: 86400
    path: ./ruleset/notion.yaml

  gemini:
    behavior: classical
    type: http
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml"
    interval: 86400
    path: ./ruleset/gemini.yaml
    
  openai:
    behavior: classical
    type: http
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OpenAI/OpenAI.yaml"
    interval: 86400
    path: ./ruleset/openai.yaml

  cloudflare:
    behavior: ipcidr
    type: http
    format: text
    url: "https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Subnets/IPv4/cloudflare.lst"
    interval: 86400
    path: ./ruleset/cloudflare.lst

  telegram:
    behavior: classical
    type: http
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram.yaml"    
    interval: 86400
    path: ./ruleset/telegram.yaml

  antropic:
    behavior: classical
    type: http
    format: yaml    
    interval: 86400
    path: ./ruleset/antropic.yaml

rules:
# Трафик, который должен идти напрямую (РФ сервисы, банки)
  - GEOIP,ru,DIRECT
# локальные
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
# Популярные сервисы
  - RULE-SET,youtube,WARP
# Отдельные программы
  - PROCESS-NAME,Code.exe,Chained VPN
# Трафик через цепочку WARP -> VPN
  - RULE-SET,my-local-request,Chained VPN
  - RULE-SET,my-remote-request,Chained VPN
  - RULE-SET,telegram,Chained VPN
  - RULE-SET,whatsapp,Chained VPN
  - RULE-SET,gemini,Chained VPN
  - RULE-SET,openai,Chained VPN
  - RULE-SET,twitter,Chained VPN
  - RULE-SET,instagram,Chained VPN
  - RULE-SET,facebook,Chained VPN
  - RULE-SET,discord-domain,Chained VPN
  - RULE-SET,discord-ip,Chained VPN
  - RULE-SET,notion,Chained VPN
  - RULE-SET,antropic,Chained VPN
  - RULE-SET,cloudflare,Chained VPN
# ВЕСЬ ОСТАЛЬНОЙ ТРАФИК
  - MATCH,WARP