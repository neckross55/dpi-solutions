  i1: <b 0xcc00000001017200002b7c63231e91da6fac95271042834fe4412ec6208d371b3f4b0612ed><r 16>

# ani917
CPS7: &CPS7
  i1: <b >

proton1: &proton1
  type: wireguard
  ip: 10.2.0.2/32
  # ipv6: 2a07:b944::2:2/128
  allowed-ips: ['0.0.0.0/0', '::/0']
  udp: true
  # dialer-proxy: "Warp"
  mtu: 1420
  remote-dns-resolve: true
  dns: [10.2.0.1]
  # dns: [10.2.0.1, 2a07:b944::2:1]
  amnezia-wg-option:
    jc: 4
    jmin: 40
    jmax: 90
    s1: 0
    s2: 0
    h1: 1
    h2: 2
    h4: 3
    h3: 4
    <<: *CPS5

