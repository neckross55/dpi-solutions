  type: url-test
  url: http://192.168.1.1 # Пингуем ваш домашний роутер для проверки связи
  interval: 300
  proxies:
    - "📱 Connect-Phone-1"
    - "📱 Connect-Phone-2"
    - "📱 Connect-Phone-3"
  
- name: WARP
  type: select
  icon: https://www.vectorlogo.zone/logos/cloudflare/cloudflare-icon.svg
  proxies:
    - "188.114.96.5:2408"
    - "8.47.69.1:2408"
    - "8.39.125.113:2408"
    - "162.159.192.214:2408"
    - "8.47.69.245:2408"
    - "8.6.112.234:2408"
    - "188.114.97.236:2408"
    - "188.114.96.203:2408"
    - "8.6.112.1:2408"

  url: 'http://speed.cloudflare.com/'
  interval: 300

- name: Changed IP
  type: select
  icon: https://res.cloudinary.com/dbulfrlrz/image/upload/v1703162849/static/logos/icons/vpn_f9embt.svg    
  proxies:
    - Relay WARP
    - BPB Panel
  url: https://cp.cloudflare.com/generate_204

# Вспомогательные группы
- name: Relay WARP
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 300
  tolerance: 100
  # override:
  # dialer-proxy: "Relay WARP"
  proxies:
    - "[🌍] 🇳🇱 Нидерланды"
    # - "[🌍] 🇵🇱 Польша"
    # - "[🌍] 🇷🇺 Россия"
    - "[🌍] 🇫🇮 Финляндия"
    - "[🌍] 🇩🇪 Германия"
    # - "[🌍] 🇱🇻 Латвия"
    - "[🌍] LTE 🇵🇱 Польша"
    - "[🌍] LTE 🇫🇮 Финляндия"
  lazy: true

- name: BPB Panel
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 300
  tolerance: 100
  proxies:
  - '💦 1 - VLESS - Domain : 443'
  - '💦 2 - VLESS - Domain : 443'
  - '💦 3 - VLESS - IPv4 : 443'
  - '💦 4 - VLESS - IPv4 : 443'
  - '💦 1 - Trojan - Domain : 443'
  - '💦 2 - Trojan - Domain : 443'
  - '💦 3 - Trojan - IPv4 : 443'
  - '💦 4 - Trojan - IPv4 : 443'
  lazy: true


