proxy-groups:

  - name: WARP
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Cloudflare.png
    proxies:
      - WARP1
    url: https://cp.cloudflare.com/generate_204
    interval: 300

  - name: Chained VPN
    type: select
    icon: https://res.cloudinary.com/dbulfrlrz/image/upload/v1703162849/static/logos/icons/vpn_f9embt.svg    
    proxies:
      - BPB auto
      - Proton Vpn auto
    url: https://cp.cloudflare.com/generate_204

  - name: BPB auto
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 10
    tolerance: 150
    use:
      - BPB set
    lazy: true

  - name: Proton Vpn auto
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    tolerance: 150
    use:
      - proton_proxies
    lazy: true

