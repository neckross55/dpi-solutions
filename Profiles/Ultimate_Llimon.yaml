- name: Changed IP
  type: select
  icon: https://res.cloudinary.com/dbulfrlrz/image/upload/v1703162849/static/logos/icons/vpn_f9embt.svg    
  proxies:
    - Relay WARP
    - Proton Vpn auto
  url: https://cp.cloudflare.com/generate_204

# Вспомогательные группы
- name: Relay WARP
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 300
  tolerance: 100
  # override:
  # dialer-proxy: "Relay WARP"
  proxies:
    - "[🌍] 🇳🇱 Нидерланды"
    # - "[🌍] 🇵🇱 Польша"
    # - "[🌍] 🇷🇺 Россия"
    - "[🌍] 🇫🇮 Финляндия"
    - "[🌍] 🇩🇪 Германия"
    # - "[🌍] 🇱🇻 Латвия"
    - "[🌍] LTE 🇵🇱 Польша"
    - "[🌍] LTE 🇫🇮 Финляндия"
  lazy: true

- name: Proton Vpn auto
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 300
  tolerance: 100
  use:
    - proton_proxies
  lazy: true

proxy-providers:
  proton_proxies:
    type: http
    url: "https://raw.githubusercontent.com/4kWarhammer/Proxi-Rule-Providers/refs/heads/main/Providers/proton-proxies.yaml"
    path: ./remote-custom-providers/proton-proxies.yaml
    override:
      dialer-proxy: "WARP"
      mtu: 1240
    health-check:
      enable: true
      interval: 300
      url: https://cp.cloudflare.com/generate_204


rule-providers:

  my-force-direct:
