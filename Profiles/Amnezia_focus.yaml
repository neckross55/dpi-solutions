hosts:
  ntc.party: 130.255.77.28

dns:
  enable: true
  # listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 9.9.9.9
    - 149.112.112.112
  nameserver:
    - https://dns.quad9.net/dns-query
    - https://dns10.quad9.net/dns-query
    - https://cloudflare-dns.com/dns-query

# keep-alive-idle: 15
# keep-alive-interval: 15

# profile:
#   store-selected: true
#   tracing: true


sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
  skip-domain:
    - '+.lan'
    - '+.local'

